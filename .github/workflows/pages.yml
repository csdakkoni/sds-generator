name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
          # Public by design (browser key); access is enforced by RLS. Never a secret here.
          VITE_SUPABASE_URL: https://nsxicgzidapirnxesqxk.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_1iWq0vL9vapPflkk5ozbTQ_KOAEgSZP
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
